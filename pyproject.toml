[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowforge"
version = "1.0.0"
description = "Autonomous ethical hacking AI agent powered by NVIDIA"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Wellington de Lima Catarina", email = "lelolima806@gmail.com"},
]
keywords = ["security", "pentest", "nvidia", "ai", "agent", "ethical-hacking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

dependencies = [
    "aiohttp>=3.9.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
    "aiofiles>=23.2.1",
    "sqlalchemy>=2.0.23",
    "aiosqlite>=0.19.0",
    "tenacity>=8.2.3",
    "click>=8.1.7",
]

[project.optional-dependencies]
vision = ["mss>=9.0.0", "pytesseract>=0.3.10", "ultralytics>=8.0.0", "opencv-python>=4.9.0"]
speech = ["grpcio>=1.60.0", "grpcio-tools>=1.60.0", "pyaudio>=0.2.14", "sounddevice>=0.4.6"]
rag = ["chromadb>=0.4.0", "sentence-transformers>=2.2.0"]
hacker = ["python-nmap>=0.7.1", "shodan>=1.31.0", "censys>=2.2.12", "paramiko>=3.4.0", "scapy>=2.5.0"]
dev = ["ruff>=0.1.0", "mypy>=1.7.0", "bandit>=1.7.0", "pytest>=7.4.0", "pytest-asyncio>=0.23.0", "pytest-cov>=4.1.0", "pre-commit>=3.6.0", "safety>=2.3.0"]
all = ["shadowforge[vision,speech,rag,hacker]"]

[project.urls]
Homepage = "https://github.com/shadowforge/NVIDIA-ShadowForge-Agent"
Documentation = "https://github.com/shadowforge/NVIDIA-ShadowForge-Agent/tree/main/docs"
Repository = "https://github.com/shadowforge/NVIDIA-ShadowForge-Agent"
Issues = "https://github.com/shadowforge/NVIDIA-ShadowForge-Agent/issues"
Changelog = "https://github.com/shadowforge/NVIDIA-ShadowForge-Agent/blob/main/CHANGELOG.md"

[project.scripts]
shadowforge = "main:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.bandit]
targets = ["core", "models", "planning"]
severity = "low"
confidence = "low"
skips = ["B101", "B311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
