<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="500" viewBox="0 0 800 500"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#16213e;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:0.95"/>
    </linearGradient>
    <linearGradient id="criticalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ff4757;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="highGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffd166;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ff9f1c;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="mediumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06d6a0;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#118ab2;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="lowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#118ab2;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#06d6a0;stop-opacity:1"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.7)"/>
    </filter>

    <marker id="arrow" markerWidth="6" markerHeight="4" refX="3" refY="2" orient="auto">
      <path d="M0,0 L0,4 L6,2 z" fill="#636e72"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Title Bar -->
  <rect x="0" y="0" width="800" height="50" fill="#0f3460" opacity="0.9" filter="url(#dropShadow)"/>
  <text x="400" y="33" text-anchor="middle"
        font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
        font-size="18" fill="#fff" font-weight="600">
    GitNexus Real-time Code Analysis • ShadowForge-Agent-main
  </text>
  <text x="750" y="33" text-anchor="end"
        font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
        font-size="12" fill="#b2bec3">
    ANALYZING • 842 symbols • 1,928 relationships • 59 flows
  </text>

  <!-- Main Visualization -->
  <g id="mainViz" transform="translate(40,80)">
    <!-- Core Nodes -->
    <g id="coreNodes">
      <!-- Orchestration Core -->
      <circle cx="400" cy="150" r="25" fill="#ff6b6b" filter="url(#glow)"/>
      <text x="400" y="155" text-anchor="middle"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="11" fill="#fff" font-weight="600">orchestration</text>
      <text x="400" y="170" text-anchor="middle"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="9" fill="#fff">.core/</text>

      <!-- Skill System -->
      <circle cx="250" cy="100" r="20" fill="#06d6a0" filter="url(#glow)"/>
      <text x="250" y="105" text-anchor="middle"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="10" fill="#fff" font-weight="600">skills</text>
      <text x="250" y="118" text-anchor="middle"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="8" fill="#fff">.agents/skills/</text>

      <!-- Plugin System -->
      <circle cx="550" cy="100" r="20" fill="#ffd166" filter="url(#glow)"/>
      <text x="550" y="105" text-anchor="middle"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="10" fill="#fff" font-weight="600">plugins</text>
      <text x="550" y="118" text-anchor="middle"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="8" fill="#fff">.codex/plugins/</text>

      <!-- Communication Bus -->
      <circle cx="400" cy="280" r="20" fill="#118ab2" filter="url(#glow)"/>
      <text x="400" y="285" text-anchor="middle"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="10" fill="#fff" font-weight="600">communication</text>
      <text x="400" y="298" text-anchor="middle"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="8" fill="#fff">.agents/communication/</text>

      <!-- Flow Manager -->
      <circle cx="250" cy="280" r="18" fill="#ff9f1c" filter="url(#glow)"/>
      <text x="250" y="285" text-anchor="middle"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="9" fill="#fff" font-weight="600">flows</text>
      <text x="250" y="298" text-anchor="middle"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="7" fill="#fff">.agents/flows/</text>
    </g>

    <!-- Skill Sub-services -->
    <g id="skillNodes" transform="translate(100,0)">
      <circle cx="150" cy="50" r="12" fill="#06d6a0" opacity="0.8"/>
      <text x="150" y="55" text-anchor="middle"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="8" fill="#fff">loader</text>
      <circle cx="150" cy="100" r="12" fill="#06d6a0" opacity="0.8"/>
      <text x="150" y="105" text-anchor="middle"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="8" fill="#fff">validator</text>
      <circle cx="150" cy="150" r="12" fill="#06d6a0" opacity="0.8"/>
      <text x="150" y="155" text-anchor="middle"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="8" fill="#fff">health</text>
      <circle cx="150" cy="200" r="12" fill="#06d6a0" opacity="0.8"/>
      <text x="150" y="205" text-anchor="middle"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="8" fill="#fff">cache</text>
    </g>

    <!-- Plugin Sub-services -->
    <g id="pluginNodes" transform="translate(450,0)">
      <circle cx="150" cy="50" r="12" fill="#ffd166" opacity="0.8/>
      <text x="150" y="55" text-anchor="middle"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="8" fill="#fff">sandbox</text>
      <circle cx="150" cy="100" r="12" fill="#ffd166" opacity="0.8/>
      <text x="150" y="105" text-anchor="middle"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="8" fill="#fff">validator</text>
      <circle cx="150" cy="150" r="12" fill="#ffd166" opacity="0.8/>
      <text x="150" y="155" text-anchor="middle"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="8" fill="#fff">threat-detector</text>
      <circle cx="150" cy="200" r="12" fill="#ffd166" opacity="0.8/>
      <text x="150" y="205" text-anchor="middle"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="8" fill="#fff">logger</text>
    </g>

    <!-- Communication Sub-services -->
    <g id="commNodes" transform="translate(0,150)">
      <circle cx="150" cy="50" r="12" fill="#118ab2" opacity="0.8/>
      <text x="150" y="55" text-anchor="middle"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="8" fill="#fff">persistence</text>
      <circle cx="150" cy="100" r="12" fill="#118ab2" opacity="0.8/>
      <text x="150" y="105" text-anchor="middle"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="8" fill="#fff">router</text>
      <circle cx="150" cy="150" r="12" fill="#118ab2" opacity="0.8/>
      <text x="150" cy="205" text-anchor="middle"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="8" fill="#fff">flow-control</text>
    </g>

    <!-- Dynamic Connections (static for clarity) -->
    <g id="connections">
      <!-- Core to Skills -->
      <path d="M 400,175 Q 325,125 250,120"
            stroke="#636e72" stroke-width="1.5" opacity="0.3"
            marker-end="url(#arrow)"/>
      <path d="M 400,175 Q 325,225 250,280"
            stroke="#636e72" stroke-width="1.5" opacity="0.3"
            marker-end="url(#arrow)"/>
      <!-- Core to Plugins -->
      <path d="M 400,175 Q 475,125 550,120"
            stroke="#636e72" stroke-width="1.5" opacity="0.3"
            marker-end="url(#arrow)"/>
      <path d="M 400,175 Q 475,225 550,280"
            stroke="#636e72" stroke-width="1.5" opacity="0.3"
            marker-end="url(#arrow)"/>
      <!-- Core to Communication -->
      <path d="M 400,175 Q 400,200 400,260"
            stroke="#636e72" stroke-width="1.5" opacity="0.3"
            marker-end="url(#arrow)"/>
      <!-- Skills internal -->
      <path d="M 250,120 Q 200,100 150,100"
            stroke="#636e72" stroke-width="1" opacity="0.2"
            marker-end="url(#arrow)"/>
      <path d="M 250,120 Q 200,140 150,150"
            stroke="#636e72" stroke-width="1" opacity="0.2"
            marker-end="url(#arrow)"/>
      <path d="M 250,120 Q 200,180 150,200"
            stroke="#636e72" stroke-width="1" opacity="0.2"
            marker-end="url(#arrow)"/>
      <!-- Plugins internal -->
      <path d="M 550,120 Q 600,100 650,100"
            stroke="#636e72" stroke-width="1" opacity="0.2"
            marker-end="url(#arrow)"/>
      <path d="M 550,120 Q 600,140 650,150"
            stroke="#636e72" stroke-width="1" opacity="0.2"
            marker-end="url(#arrow)"/>
      <path d="M 550,120 Q 600,180 650,200"
            stroke="#636e72" stroke-width="1" opacity="0.2"
            marker-end="url(#arrow)"/>
      <!-- Communication internal -->
      <path d="M 400,300 Q 350,320 300,350"
            stroke="#636e72" stroke-width="1" opacity="0.2"
            marker-end="url(#arrow)"/>
      <path d="M 400,300 Q 450,320 500,350"
            stroke="#636e72" stroke-width="1" opacity="0.2"
            marker-end="url(#arrow)"/>
    </g>

    <!-- Animated Data Packets on Connections -->
    <g id="dataFlow">
      <circle cx="325" cy="125" r="3" fill="#00b894" opacity="0">
        <animateMotion dur="4s" repeatCount="indefinite">
          <mpath xlink:href="#path1"/>
        </animateMotion>
      </circle>
      <circle cx="325" cy="225" r="3" fill="#00b894" opacity="0>
        <animateMotion dur="4s" repeatCount="indefinite" begin="0.5s">
          <mpath xlink:href="#path2"/>
        </animateMotion>
      </circle>
      <circle cx="475" cy="125" r="3" fill="#00b894" opacity="0>
        <animateMotion dur="4s" repeatCount="indefinite" begin="1s">
          <mpath xlink:href="#path3"/>
        </animateMotion>
      </circle>
      <circle cx="475" cy="225" r="3" fill="#00b894" opacity="0>
        <animateMotion dur="4s" repeatCount="indefinite" begin="1.5s">
          <mpath xlink:href="#path4"/>
        </animateMotion>
      </circle>
      <circle cx="400" cy="200" r="3" fill="#00b894" opacity="0>
        <animateMotion dur="4s" repeatCount="indefinite" begin="2s">
          <mpath xlink:href="#path5"/>
        </animateMotion>
      </circle>

      <!-- Path definitions -->
      <path id="path1" d="M 400,175 Q 325,125 250,120" fill="none"/>
      <path id="path2" d="M 400,175 Q 325,225 250,280" fill="none"/>
      <path id="path3" d="M 400,175 Q 475,125 550,120" fill="none"/>
      <path id="path4" d="M 400,175 Q 475,225 550,280" fill="none"/>
      <path id="path5" d="M 400,175 Q 400,200 400,260" fill="none"/>
    </g>
  </g>

  <!-- Right Sidebar: Analysis Details -->
  <g id="sidebar" transform="translate(600,80)">
    <rect x="0" y="0" width="160" height="340" rx="8"
          fill="url(#panelGrad)" filter="url(#innerShadow)"/>
    <text x="80" y="25" text-anchor="middle"
          font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
          font-size="14" fill="#fff" font-weight="500">
      Analysis Details
    </text>

    <!-- Critical Issues -->
    <g transform="translate(10,40)">
      <text x="0" y="0"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="12" fill="#ff6b6b" font-weight="600">● Critical Issues: 3</text>
      <text x="0" y="20"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="10" fill="#dfe6e9">• Circular dependency in skill-loader</text>
      <text x="0" y="35"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="10" fill="#dfe6e9">• Unvalidated plugin input</text>
      <text x="0" y="50"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="10" fill="#dfe6e9">• Missing circuit breaker</text>

      <circle cx="150" cy="25" r="6" fill="#ff6b6b" opacity="0">
        <animate attributeName="r" values="4;8;4" dur="1.5s"
                 repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.7;0.3"
                 dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- High Priority -->
    <g transform="translate(10,80)">
      <text x="0" y="0"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="12" fill="#ffd166" font-weight="600">● High Priority: 7</text>
      <text x="0" y="20"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="10" fill="#dfe6e9">• Performance bottlenecks</text>
      <text x=0" y="35"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="10" fill="#dfe6e9">• Documentation gaps</text>
    </g>

    <!-- Metrics -->
    <g transform="translate(10,140)">
      <text x="0" y="0"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="12" fill="#fff">Analysis Metrics:</text>
      <text x="0" y="20"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="10" fill="#dfe6e9">• Avg. Coupling: 2.3 → 1.8</text>
      <text x="0" y="35"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="10" fill="#dfe6e9">• Critical Paths: 12 → 8</text>
      <text x="0" y="50"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="10" fill="#dfe6e9">• Stability Score: 7.8 → 9.2</text>
      <text x="0" y="65"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="10" fill="#dfe6e9">• Security Score: 6.5 → 9.1</text>
    </g>

    <!-- Real-time Update Indicator -->
    <g transform="translate(10,300)">
      <rect x="0" y="0" width="140" height="30" rx="5"
            fill="#16213e"/>
      <text x="70" y="18" text-anchor="middle"
            font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
            font-size="11" fill="#06d6a0">● UPDATING…</text>
      <rect x="5" y="5" width="0" height="20" rx="3"
            fill="#06d6a0">
        <animate attributeName="width" from="0" to="130" dur="3s"
                 repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Bottom Panel: Trend Analysis -->
  <g id="trendPanel" transform="translate(40,440)">
    <rect x="0" y="0" width="720" height="40" rx="8"
          fill="url(#panelGrad)" filter="url(#innerShadow)"/>
    <text x="360" y="20" text-anchor="middle"
          font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"
          font-size="12" fill="#fff" font-weight="500">
      Stability Trend (Last 24h)
    </text>
    <path d="M 20,30 Q 40,10 60,25 T 100,40 T 140,20 T 180,35 T 220,25 T 260,40 T 300,30 T 340,20 T 380,35 T 420,25 T 460,40 T 500,30 T 540,20 T 580,35 T 620,25 T 660,40 T 700,30"
          fill="none" stroke="url(#mediumGrad)" stroke-width="2" opacity="0.8"/>
    <circle cx="20" cy="30" r="3" fill="#06d6a0"/>
    <circle cx="700" cy="30" r="3" fill="#06d6a0"/>
    <circle cx="360" cy="30" r="5" fill="#06d6a0" opacity="0.7">
      <animate attributeName="cx" values="20;700;20" dur="8s"
               repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Subtle Background Particles -->
  <g id="particles">
    <circle cx="100" cy="100" r="1" fill="#fff" opacity="0.2">
      <animate attributeName="cx" values="100;700;100" dur="15s"
               repeatCount="indefinite"/>
      <animate attributeName="cy" values="100;400;100" dur="12s"
               repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="300" r="1" fill="#fff" opacity="0.15">
      <animate attributeName="cx" values="200;600;200" dur="18s"
               repeatCount="indefinite"/>
      <animate attributeName="cy" values="300;100;300" dur="14s"
               repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="200" r="1" fill="#fff" opacity="0.25>  <!-- Note: I removed the stray '>' and extra quote. Adjusted. -->
      <animate attributeName="cx" values="500;100;500" dur="20s"
               repeatCount="indefinite"/>
      <animate attributeName="cy" values="200;450;200" dur="16s"
               repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
