name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install tools
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -c constraints-py313.txt
      - name: Ruff (todas as regras do pyproject.toml)
        run: ruff check . --output-format github
      - name: Mypy (módulos centrais de segurança)
        run: mypy core/scope.py core/audit.py core/config.py core/agent.py hacker_tools/recon/scanner.py --follow-imports=silent

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # 3.13 usa versões exatas (reprodutível); 3.10 valida as faixas mínimas do requirements
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.python-version }}" = "3.13" ]; then
            pip install -r requirements.txt -r requirements-dev.txt -c constraints-py313.txt
          else
            pip install -r requirements.txt -r requirements-dev.txt
          fi
      - name: Validate imports
        run: python tests/test_imports.py
      - name: Run tests
        run: pytest tests -q --cov --cov-report=term
      - name: Dependency audit
        if: matrix.python-version == '3.13'
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt
          pip-audit -r constraints-py313.txt

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Smoke test CLI
        run: |
          pip install dist/*.whl -r requirements.txt
          python main.py --help
