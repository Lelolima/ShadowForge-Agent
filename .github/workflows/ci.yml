name: CI

on:
  push:
    branches: [ main, develop, 'releases/*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -r requirements.txt
      - name: Run Ruff lint
        run: ruff check .
      - name: Run Ruff format check
        run: ruff format --check .
      - name: Run MyPy type check
        run: |
          mypy core/ models/ planning/ --ignore-missing-imports

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest pytest-cov
      - name: Validate imports
        run: python tests/test_imports.py
      - name: Validate environment
        run: python scripts/validate_env.py
      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=core --cov=models --cov=planning --cov=control --cov=vision --cov=speech --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=test-results.xml
      - name: Check coverage threshold
        run: |
          # Fail if total coverage is less than 80%
          coverage report --fail-under=80
      - name: Upload coverage artifact
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results.xml

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
      - name: Run Bandit security scan
        id: bandit
        continue-on-error: true
        run: |
          bandit -r core/ models/ planning/ -ll --format json -o bandit-report.json --exclude B101,B311
      - name: Run Safety dependency check
        id: safety
        continue-on-error: true
        run: |
          safety check -r requirements.txt --json > safety-report.json || true
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
      - name: Fail on high severity issues
        if: steps.bandit.outcome == 'failure' || steps.safety.outcome == 'failure'
        run: |
          echo "Security checks failed. Please review the artifacts."
          exit 1

  docker:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/shadowforge-agent:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/shadowforge-agent:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/shadowforge-agent:buildcache,mode=max
      - name: Test Docker image
        run: |
          docker run --rm ${{ secrets.DOCKERHUB_USERNAME }}/shadowforge-agent:latest --help

  examples:
    name: Run Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pentest lab example
        run: |
          python examples/pentest_lab.py
      - name: Upload example output artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pentest-lab-output
          path: data/campaigns/*.json