  <text x="570" y="155" class="phase-detail" fill="#ffd70088">Path Traversal</text>
  <text x="570" y="167" class="phase-detail" fill="#ffd70088">PoC Generation</text>
  <text x="570" y="185" class="phase-detail" fill="#ffd70044">NIM Analysis</text>

  <!-- Phase 6: POST -->
  <rect x="640" y="80" width="110" height="140" class="phase-box" stroke="#ff6600" rx="8" style="animation:phaseActive 2s 1.33s infinite"/>
  <text x="695" y="105" class="phase-label" fill="#ff6600">🔓 POST</text>
  <text x="695" y="125" class="phase-detail" fill="#ff6600">PrivEsc Check</text>
  <text x="695" y="137" class="phase-detail" fill="#ff6600">Lateral Mov.</text>
  <text x="695" y="155" class="phase-detail" fill="#ff660088">Persistence</text>
  <text x="695" y="167" class="phase-detail" fill="#ff660088">OPSEC Cleanup</text>
  <text x="695" y="185" class="phase-detail" fill="#ff660044">linpeas/winpeas</text>

  <!-- Phase 7: REPORT -->
