<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Courier New', monospace">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowRed"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0a0a0f"/><stop offset="100%" style="stop-color:#0d1117"/></linearGradient>
  </defs>

  <style>
    @keyframes phaseActive { 0%,100%{opacity:0.3} 50%{opacity:1;filter:url(#glow)} }
    @keyframes arrowPulse { 0%,100%{opacity:0.3} 50%{opacity:1} }
    @keyframes dataFlow { from{stroke-dashoffset:0} to{stroke-dashoffset:-20} }
    @keyframes slideIn { from{transform:translateX(-20px);opacity:0} to{transform:translateX(0);opacity:1} }
    @keyframes scanLine { from{transform:translateY(0)} to{transform:translateY(400px)} }

    .bg { fill:url(#bgGrad) }
    .phase-box { fill:#0a0a0f; stroke-width:2; rx:6; }
    .phase-active { animation:phaseActive 2s ease-in-out infinite; }
    .active-flow { stroke-dasharray:6 3; animation:dataFlow 1s linear infinite; }
    .scanline { stroke:#00ff4108; stroke-width:1; animation:scanLine 4s linear infinite; }
    .title { fill:#0ff; font-size:20px; font-weight:bold; text-anchor:middle; filter:url(#glow); }
    .phase-label { font-size:12px; font-weight:bold; text-anchor:middle; }
    .phase-detail { font-size:8px; text-anchor:middle; opacity:0.7; }
    .connector { fill:none; stroke-width:2; stroke-dasharray:8 4; }
  </style>

  <rect class="bg" width="900" height="400"/>
  <rect x="0" y="0" width="900" height="400" fill="none" stroke="#00ff4110" stroke-width="1"/>
  <line x1="0" y1="0" x2="900" y2="0" class="scanline"/>

  <text x="450" y="30" class="title">⚔️ SH4D0WF0RG3 — KILL CHAIN</text>
  <text x="450" y="48" class="phase-detail" fill="#00ff41" style="opacity:0.5">Fully Autonomous Pentest Campaign (Ethics First → Hack Second)</text>

  <!-- Phase 1: IDLE -->
  <rect x="15" y="80" width="110" height="140" class="phase-box" stroke="#00ff4166" rx="8"/>
  <text x="70" y="105" class="phase-label" fill="#00ff41">⏸ IDLE</text>
  <text x="70" y="125" class="phase-detail" fill="#00ff41">Waiting for</text>
  <text x="70" y="137" class="phase-detail" fill="#00ff41">target input</text>
  <text x="70" y="155" class="phase-detail" fill="#00ff4166">Authorization</text>
  <text x="70" y="167" class="phase-detail" fill="#00ff4166">check</text>
  <text x="70" y="185" class="phase-detail" fill="#00ff4144">Ready state</text>

  <!-- Phase 2: RECON -->
  <rect x="140" y="80" width="110" height="140" class="phase-box" stroke="#0ff" rx="8" style="animation:phaseActive 2s infinite"/>
  <text x="195" y="105" class="phase-label" fill="#0ff">🔍 RECON</text>
  <text x="195" y="125" class="phase-detail" fill="#0ff">Port Scanning</text>
  <text x="195" y="137" class="phase-detail" fill="#0ff">OSINT (Shodan)</text>
  <text x="195" y="155" class="phase-detail" fill="#0ff88">DNS Enum</text>
  <text x="195" y="167" class="phase-detail" fill="#0ff88">Web Fingerprint</text>
  <text x="195" y="185" class="phase-detail" fill="#0ff44">Nmap + Vision</text>

  <!-- Phase 3: SCAN -->
