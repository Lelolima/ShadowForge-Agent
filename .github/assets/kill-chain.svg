  <line x1="250" y1="150" x2="265" y2="150" class="connector" stroke="#0ff" style="animation:dataFlow 1.1s linear infinite"/>
  <line x1="375" y1="150" x2="390" y2="150" class="connector" stroke="#0ff" style="animation:dataFlow 1.2s linear infinite"/>
  <line x1="500" y1="150" x2="515" y2="150" class="connector" stroke="#0ff" style="animation:dataFlow 1.3s linear infinite"/>
  <line x1="625" y1="150" x2="640" y2="150" class="connector" stroke="#ffd700" style="animation:dataFlow 1.4s linear infinite"/>
  <line x1="750" y1="150" x2="765" y2="150" class="connector" stroke="#ff6600" style="animation:dataFlow 1.5s linear infinite"/>

  <!-- Arrow heads -->
  <polygon points="138,146 142,150 138,154" fill="#00ff41"/>
  <polygon points="263,146 267,150 263,154" fill="#0ff"/>
  <polygon points="388,146 392,150 388,154" fill="#0ff"/>
  <polygon points="513,146 517,150 513,154" fill="#0ff"/>
  <polygon points="638,146 642,150 638,154" fill="#ffd700"/>
  <polygon points="763,146 767,150 763,154" fill="#ff6600"/>

  <!-- NVIDIA Stack Below -->
