  <text x="320" y="105" class="phase-label" fill="#0ff">📡 SCAN</text>
  <text x="320" y="125" class="phase-detail" fill="#0ff">Service Detection</text>
  <text x="320" y="137" class="phase-detail" fill="#0ff">OS Fingerprint</text>
  <text x="320" y="155" class="phase-detail" fill="#0ff88">Vuln Scripts</text>
  <text x="320" y="167" class="phase-detail" fill="#0ff88">Version Enum</text>
  <text x="320" y="185" class="phase-detail" fill="#0ff44">Nmap -sV -sC</text>

