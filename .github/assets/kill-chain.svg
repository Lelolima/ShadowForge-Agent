  <rect x="390" y="80" width="110" height="140" class="phase-box" stroke="#0ff" rx="8" style="animation:phaseActive 2s 0.66s infinite"/>
  <text x="445" y="105" class="phase-label" fill="#0ff">📋 ENUM</text>
  <text x="445" y="125" class="phase-detail" fill="#0ff">Service Enum</text>
  <text x="445" y="137" class="phase-detail" fill="#0ff">User Discovery</text>
  <text x="445" y="155" class="phase-detail" fill="#0ff88">Share Enum SMB</text>
  <text x="445" y="167" class="phase-detail" fill="#0ff88">SNMP Enum</text>
