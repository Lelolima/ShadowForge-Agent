    <text x="50" y="20" fill="#76B900" font-size="9" font-weight="bold" text-anchor="middle">Nemotron</text>
    <text x="50" y="34" fill="#76B90088" font-size="7" text-anchor="middle">Vision VL</text>
    <text x="50" y="46" fill="#76B90066" font-size="6" text-anchor="middle">500ms</text>
  </g>
  <g transform="translate(490,290)">
    <rect x="0" y="0" width="100" height="55" fill="#0d1117" stroke="#76B90044" stroke-width="1" rx="4"/>
    <text x="50" y="20" fill="#76B900" font-size="9" font-weight="bold" text-anchor="middle">NeMo Retriever</text>
    <text x="50" y="34" fill="#76B90088" font-size="7" text-anchor="middle">Embeddings</text>
    <text x="50" y="46" fill="#76B90066" font-size="6" text-anchor="middle">100ms</text>
  </g>
  <g transform="translate(605,290)">
