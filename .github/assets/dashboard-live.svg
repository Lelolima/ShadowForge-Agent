<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Courier New', monospace">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowSmall"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0a0a0f"/><stop offset="100%" style="stop-color:#0d1117"/></linearGradient>
    <linearGradient id="progressCritical" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#ff0040"/><stop offset="100%" style="stop-color:#ff0040"/></linearGradient>
  </defs>

  <style>
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    @keyframes scanLine { from{transform:translateY(0)} to{transform:translateY(500px)} }
    @keyframes barFill { from{width:0%} to{width:var(--target-width)} }
    @keyframes numberCount { 0%{opacity:0} 100%{opacity:1} }
    @keyframes slideUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    @keyframes rotate { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes ping { 0%{transform:scale(1);opacity:1} 100%{transform:scale(2.5);opacity:0} }
    @keyframes radar { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

    .bg { fill:url(#bgGrad) }
    .card { fill:#0a0a0f; stroke-width:1; rx:6; }
    .scanline { stroke:#00ff4110; stroke-width:1; animation:scanLine 3s linear infinite; }
    .pulse { animation:pulse 2s ease-in-out infinite; }
    .title { fill:#0ff; font-size:18px; font-weight:bold; filter:url(#glow); }
    .metric-value { font-size:28px; font-weight:bold; fill:#0ff; filter:url(#glowSmall); }
    .metric-label { font-size:8px; fill:#00ff4188; }
    .progress-bg { fill:#0d1117; stroke:none; }
    .online-dot { fill:#00ff41; animation:pulse 2s infinite; }
  </style>

