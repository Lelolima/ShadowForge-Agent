<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Courier New', monospace">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0a0a0f"/><stop offset="100%" style="stop-color:#0d1117"/></linearGradient>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#00ff41"/></marker>
    <marker id="arrowCyan" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0ff"/></marker>
    <marker id="arrowYellow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ffd700"/></marker>
  </defs>

  <style>
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    @keyframes slowRotate { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes scanLine { from{transform:translateY(0)} to{transform:translateY(600px)} }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
    @keyframes flowRight { from{stroke-dashoffset:0} to{stroke-dashoffset:-30} }

    .bg { fill:url(#bgGrad) }
    .box { fill:#0a0a0f; stroke-width:1.5; stroke-opacity:0.5; rx:6; }
    .title { fill:#0ff; font-size:20px; font-weight:bold; text-anchor:middle; filter:url(#glow); }
    .label { fill:#00ff41; font-size:10px; font-weight:bold; }
    .detail { fill:#00ff4188; font-size:8px; }
    .scanline { stroke:#00ff4110; stroke-width:1; animation:scanLine 4s linear infinite; }
    .flow-line { fill:none; stroke-width:1.5; stroke-dasharray:6 3; animation:flowRight 1.5s linear infinite; }
    .pulse-dot { animation:pulse 2s ease-in-out infinite; }
  </style>

