<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .shield {
      fill: none;
      stroke: #0f0;
      stroke-width: 3;
      filter: drop-shadow(0 0 5px #0f0);
    }
    .hash-text {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      fill: #0f0;
      text-anchor: middle;
    }
    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }
    @keyframes hashShift {
      0%, 20% { content: "MD5: a1b2c3d4e5f6..."; }
      25%, 45% { content: "MD5: a1b2c3d4e5f6... →"; }
      50%, 70% { content: "BLAKE3: a1b2c3d4e5f67890..."; }
      75%, 100% { content: "BLAKE3: a1b2c3d4e5f67890... ✓"; }
    }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    .hash-text::after {
      content: "MD5: a1b2c3d4e5f6...";
      animation: hashShift 6s ease-in-out infinite;
    }
  </style>

  <!-- Shield outline -->
  <path class="shield pulse" d="M100,20
    C140,20 170,50 170,90
    C170,130 130,170 100,180
    C70,170 30,130 30,90
    C30,50 60,20 100,20 Z"/>

  <!-- Inner details -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="#0f0" stroke-width="1" opacity="0.3"/>

  <!-- Hash text -->
  <text x="100" y="105" class="hash-text">MD5: a1b2c3d4e5f6...</text>

  <!-- Lock icon -->
  <path d="M100,115
    h-15
    v-10
    h-10
    v10
    h-15
    v15
    h60
    v-15
    h-15
    v-10
    h-10
    v10
    h-15
    z"
    fill="#0f0" opacity="0.7"/>
</svg>