<svg width="280" height="180" viewBox="0 0 280 180" xmlns="http://www.w3.org/www.w3.org/2000/svg">
  <style>
    .terminal-bg {
      fill: #000;
      stroke: #333;
      stroke-width: 2;
      rx: 5;
      ry: 5;
    }
    .terminal-bar {
      fill: #555;
      height: 20;
    }
    .terminal-dot {
      fill: #f00;
      cx: 15;
      cy: 15;
      r: 3;
    }
    .terminal-dot.yellow { fill: #ff0; }
    .terminal-dot.green { fill: #0f0; }
    .terminal-text {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      fill: #0f0;
    }
    @keyframes type {
      from { width: 0; }
      to { width: 100%; }
    }
    .typing {
      overflow: hidden;
      white-space: nowrap;
      border-right: 2px solid #0f0;
      width: 0;
      animation: type 2s steps(20, end) forwards;
    }
    @keyframes blink {
      0%, 70% { border-color: transparent; }
      71%, 100% { border-color: #0f0; }
    }
    .cursor {
      display: inline-block;
      width: 2px;
      background-color: #0f0;
      animation: blink 1s infinite;
    }
  </style>

  <!-- Terminal background -->
  <rect class="terminal-bg" x="10" y="10" width="260" height="160"/>
  <rect class="terminal-bar" x="10" y="10" width="260" height="20"/>

  <!-- Traffic lights -->
  <circle class="terminal-dot" cx="15" cy="20" r="3"/>
  <circle class="terminal-dot yellow" cx="25" cy="20" r="3"/>
  <circle class="terminal-dot green" cx="35" cy="20" r="3"/>

  <!-- Terminal content -->
  <foreignObject x="20" y="40" width="240" height="120">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Courier New', monospace; font-size: 12px; color: #0f0; line-height: 1.4;">
      <div>$ python scripts/generate_plugin.py recon_plugin --author "Red Team" --description "Network reconnaissance plugin" --version "1.0.0"</div>
      <div class="typing">[+] Creating plugin directory: plugins/recon_plugin/</div>
      <div class="typing">[+] Writing __init__.py with metadata</div>
      <div class="typing">[+] Writing plugin.py with ShadowForgePlugin template</div>
      <div class="typing">[+] Adding README.md template</div>
      <div class="typing">[+] Plugin generated successfully!</div>
      <div><span class="cursor"></span></div>
    </div>
  </foreignObject>
</svg>