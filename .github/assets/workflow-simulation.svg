<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Courier New', monospace">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0a0a0f"/><stop offset="100%" style="stop-color:#0d1117"/></linearGradient>
  </defs>

  <style>
    @keyframes typing { from{width:0} to{width:100%} }
    @keyframes cursor { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes scanLine { from{transform:translateY(0)} to{transform:translateY(600px)} }
    @keyframes fadeIn { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
    @keyframes progressBar { from{width:0%} to{width:100%} }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .bg { fill:url(#bgGrad) }
    .terminal-bg { fill:#0a0a0f; stroke:#00ff4133; stroke-width:1; }
    .terminal-text { fill:#00ff41; font-size:11px; }
    .terminal-prompt { fill:#0ff; font-size:11px; }
    .terminal-output { fill:#00ff4188; font-size:10px; }
    .cursor { animation:cursor 1s infinite; }
    .scanline { stroke:#00ff4110; stroke-width:1; animation:scanLine 4s linear infinite; }
    .title { fill:#0ff; font-size:18px; font-weight:bold; text-anchor:middle; filter:url(#glow); }
    .fade-in { animation:fadeIn .5s ease-out forwards; }
    .pulse { animation:pulse 2s ease-in-out infinite; }
  </style>

