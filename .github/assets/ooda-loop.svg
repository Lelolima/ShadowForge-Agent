<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Courier New', monospace">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowStrong"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0a0a0f"/><stop offset="100%" style="stop-color:#0d1117"/></linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#00ff4155"/><stop offset="100%" style="stop-color:#00ff41"/></linearGradient>
  </defs>

  <style>
    @keyframes pulse { 0%,100% {opacity:1} 50% {opacity:.4} }
    @keyframes orbit { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes dash { to{stroke-dashoffset:-100} }
    @keyframes flicker { 0%,100% {opacity:1} 92% {opacity:1} 93% {opacity:.3} 94% {opacity:1} 96% {opacity:.2} 97% {opacity:1} }
    @keyframes dataFlow { from{stroke-dashoffset:0} to{stroke-dashoffset:-40} }
    @keyframes phaseFade { 0%,20%{fill:#00ff41;stroke:#00ff4199} 25%,45%{fill:#0ff;stroke:#0ff99} 50%,70%{fill:#ffd700;stroke:#ffd70099} 75%,95%{fill:#ff0040;stroke:#ff004099} 100%{fill:#00ff41;stroke:#00ff4199} }
    @keyframes phaseFade2 { 0%,15%{opacity:.3} 25%,40%{opacity:1} 50%,65%{opacity:.3} 75%,90%{opacity:1} 100%{opacity:.3} }
    @keyframes scanLine { from{transform:translateY(0)} to{transform:translateY(600px)} }
    @keyframes matrixRain { 0%{transform:translateY(-100%)} 100%{transform:translateY(600px)} }

    .bg { fill:url(#bgGrad) }
    .node { fill:#111; stroke-width:2; }
    .node-text { fill:#00ff41; font-size:14px; font-weight:bold; text-anchor:middle; }
    .data-line { fill:none; stroke-width:1.5; stroke-dasharray:8 4; }
    .pulse { animation:pulse 2s ease-in-out infinite; }
    .pulse-slow { animation:pulse 4s ease-in-out infinite; }
    .dash-anim { animation:dash 2s linear infinite; }
    .flicker { animation:flicker 3s linear infinite; }
    .phase-node { transition:all .5s ease; }
    .hud-text { fill:#00ff4166; font-size:10px; }
    .title { fill:#0ff; font-size:24px; font-weight:bold; text-anchor:middle; filter:url(#glow); }
    .subtitle { fill:#00ff4188; font-size:12px; text-anchor:middle; }
    .scanline { stroke:#00ff4110; stroke-width:1; animation:scanLine 4s linear infinite; }
    .matrix-col { fill:#00ff4120; font-size:12px; animation:matrixRain 8s linear infinite; }
  </style>

  <!-- Background -->
  <rect class="bg" width="800" height="600"/>
  <rect x="0" y="0" width="800" height="600" fill="none" stroke="#00ff4110" stroke-width="1"/>

  <!-- Grid lines -->
  <line x1="0" y1="150" x2="800" y2="150" stroke="#00ff4108" stroke-width="0.5"/>
  <line x1="0" y1="450" x2="800" y2="450" stroke="#00ff4108" stroke-width="0.5"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#00ff4105" stroke-width="0.3"/>
  <line x1="200" y1="0" x2="200" y2="600" stroke="#00ff4108" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="600" stroke="#00ff4108" stroke-width="0.5"/>

  <!-- Scan line -->
  <line x1="0" y1="0" x2="800" y2="0" class="scanline"/>

  <!-- Title -->
  <text x="400" y="40" class="title">🔄 SH4D0WF0RG3 — OODA LOOP</text>
  <text x="400" y="58" class="subtitle">Observe → Orient → Decide → Act (Autonomous Pentest Engine)</text>

  <!-- CENTER: Agent Core -->
  <circle cx="400" cy="310" r="35" class="node" stroke="#0ff" filter="url(#glow)"/>
  <text x="400" y="305" fill="#0ff" font-size="11" font-weight="bold" text-anchor="middle">AGENT</text>
  <text x="400" y="320" fill="#0ff" font-size="9" text-anchor="middle">CORE</text>

  <!-- OBSERVE Node (left) -->
  <circle cx="130" cy="200" r="30" class="node" stroke="#00ff41" style="animation:phaseFade 6s infinite"/>
  <text x="130" y="195" fill="#00ff41" font-size="11" font-weight="bold" text-anchor="middle">👁 OBSERVE</text>
  <text x="130" y="210" fill="#00ff4188" font-size="8" text-anchor="middle">Vision · OCR · ASR</text>
  <!-- Data labels -->
  <text x="130" y="235" fill="#00ff4166" font-size="7" text-anchor="middle">Screen Capture</text>
  <text x="130" y="245" fill="#00ff4166" font-size="7" text-anchor="middle">Nemotron Vision</text>
  <text x="130" y="255" fill="#00ff4166" font-size="7" text-anchor="middle">Tesseract OCR</text>
  <text x="130" y="265" fill="#00ff4166" font-size="7" text-anchor="middle">Riva ASR</text>

  <!-- ORIENT Node (top) -->
  <circle cx="400" cy="140" r="30" class="node" stroke="#0ff" style="animation:phaseFade 6s 1.5s infinite"/>
  <text x="400" y="135" fill="#0ff" font-size="11" font-weight="bold" text-anchor="middle">🧭 ORIENT</text>
  <text x="400" y="150" fill="#0ff88" font-size="8" text-anchor="middle">RAG · Memory · Analysis</text>
  <!-- Data labels -->
  <text x="400" y="125" fill="#0ff66" font-size="7" text-anchor="middle">MITRE ATT&amp;CK RAG</text>
  <text x="400" y="115" fill="#0ff66" font-size="7" text-anchor="middle">Long-term Memory</text>
  <text x="400" y="105" fill="#0ff66" font-size="7" text-anchor="middle">OWASP Top 10</text>

  <!-- DECIDE Node (right) -->
  <circle cx="670" cy="200" r="30" class="node" stroke="#ffd700" style="animation:phaseFade 6s 3s infinite"/>
  <text x="670" y="195" fill="#ffd700" font-size="11" font-weight="bold" text-anchor="middle">🧠 DECIDE</text>
  <text x="670" y="210" fill="#ffd70088" font-size="8" text-anchor="middle">Ethics · Risk · Planning</text>
  <!-- Data labels -->
  <text x="670" y="235" fill="#ffd70066" font-size="7" text-anchor="middle">Ethical Guardrails</text>
  <text x="670" y="245" fill="#ffd70066" font-size="7" text-anchor="middle">Risk Assessment</text>
  <text x="670" y="255" fill="#ffd70066" font-size="7" text-anchor="middle">State Machine</text>
  <text x="670" y="265" fill="#ffd70066" font-size="7" text-anchor="middle">NIM Llama 3.3 70B</text>

  <!-- ACT Node (bottom) -->
  <circle cx="400" cy="480" r="30" class="node" stroke="#ff0040" style="animation:phaseFade 6s 4.5s infinite"/>
  <text x="400" y="475" fill="#ff0040" font-size="11" font-weight="bold" text-anchor="middle">⚡ ACT</text>
  <text x="400" y="490" fill="#ff004088" font-size="8" text-anchor="middle">Exploit · Control · Report</text>
  <!-- Data labels -->
  <text x="400" y="505" fill="#ff004066" font-size="7" text-anchor="middle">Nmap · SQLMap · Metasploit</text>
  <text x="400" y="515" fill="#ff004066" font-size="7" text-anchor="middle">Stealth Mouse/Keyboard</text>
  <text x="400" y="525" fill="#ff004066" font-size="7" text-anchor="middle">Web Attacks (SQLi/XSS)</text>
  <text x="400" y="535" fill="#ff004066" font-size="7" text-anchor="middle">Report Generation</text>

  <!-- Connection arrows with data flow -->
  <!-- Observe → Core -->
  <line x1="160" y1="200" x2="365" y2="310" class="data-line" stroke="#00ff41" style="animation:dash 1.5s linear infinite"/>
  <text x="250" y="245" fill="#00ff4188" font-size="7" text-anchor="middle">screenshot</text>

  <!-- Core → Orient -->
  <line x1="400" y1="275" x2="400" y2="170" class="data-line" stroke="#0ff" style="animation:dash 1.5s linear infinite"/>
  <text x="415" y="225" fill="#0ff88" font-size="7">observations</text>

  <!-- Orient → Core -->
  <line x1="400" y1="170" x2="365" y2="310" class="data-line" stroke="#0ff" style="animation:dash 2s linear infinite"/>
  <text x="375" y="245" fill="#0ff88" font-size="7" text-anchor="end">context</text>

  <!-- Core → Decide -->
  <line x1="435" y1="310" x2="640" y2="200" class="data-line" stroke="#ffd700" style="animation:dash 1.8s linear infinite"/>
  <text x="540" y="245" fill="#ffd70088" font-size="7" text-anchor="middle">oriented_data</text>

  <!-- Decide → Core -->
  <line x1="640" y1="200" x2="435" y2="310" class="data-line" stroke="#ffd700" style="animation:dash 2.2s linear infinite"/>
  <text x="540" y="270" fill="#ffd70088" font-size="7" text-anchor="middle">decision</text>

  <!-- Core → Act -->
  <line x1="400" y1="345" x2="400" y2="450" class="data-line" stroke="#ff0040" style="animation:dash 1.2s linear infinite"/>
  <text x="415" y="400" fill="#ff004088" font-size="7">command</text>

  <!-- Act → Core -->
  <line x1="365" y1="450" x2="365" y2="345" class="data-line" stroke="#ff0040" style="animation:dash 2s linear infinite"/>
  <text x="350" y="400" fill="#ff004088" font-size="7" text-anchor="end">result</text>

  <!-- Legend -->
  <g transform="translate(570,460)">
    <rect x="0" y="0" width="210" height="120" fill="#0a0a0fcc" stroke="#00ff4133" stroke-width="1" rx="4"/>
    <text x="10" y="18" fill="#0ff" font-size="9" font-weight="bold">LEGENDA</text>
    <circle cx="15" cy="32" r="4" fill="#00ff4199"/><text x="25" y="35" fill="#00ff4188" font-size="8">Dados de entrada</text>
    <circle cx="15" cy="48" r="4" fill="#0ff99"/><text x="25" y="51" fill="#0ff88" font-size="8">Análise/Contexto</text>
    <circle cx="15" cy="64" r="4" fill="#ffd70099"/><text x="25" y="67" fill="#ffd70088" font-size="8">Decisão Tática</text>
    <circle cx="15" cy="80" r="4" fill="#ff004099"/><text x="25" y="83" fill="#ff004088" font-size="8">Execução/Controle</text>
    <text x="10" y="100" fill="#00ff4144" font-size="7">Ciclo: ~1-2 segundos</text>
    <text x="10" y="112" fill="#00ff4144" font-size="7">Max iterações: configurável</text>
  </g>

  <!-- Status bar -->
  <rect x="0" y="580" width="800" height="20" fill="#0a0a0f"/>
  <text x="10" y="594" fill="#00ff4166" font-size="8">OODA CYCLE #1</text>
  <text x="150" y="594" fill="#00ff4166" font-size="8">PHASE: OBSERVE</text>
  <text x="320" y="594" fill="#00ff4166" font-size="8">FPS: 30</text>
  <text x="400" y="594" fill="#00ff4166" font-size="8">ITER: 42</text>
  <text x="500" y="594" fill="#00ff4166" font-size="8">MEM: 14k tokens</text>
  <text x="680" y="594" fill="#00ff4166" font-size="8">LATENCY: 45ms</text>

  <!-- Corner accents -->
  <path d="M0,0 L20,0 L20,3 L3,3 L3,20 L0,20 Z" fill="#0ff44"/>
  <path d="M800,0 L780,0 L780,3 L797,3 L797,20 L800,20 Z" fill="#0ff44"/>
  <path d="M0,600 L20,600 L20,597 L3,597 L3,580 L0,580 Z" fill="#0ff44"/>
  <path d="M800,600 L780,600 L780,597 L797,597 L797,580 L800,580 Z" fill="#0ff44"/>
</svg>