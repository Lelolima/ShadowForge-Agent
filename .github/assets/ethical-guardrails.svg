<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Courier New', monospace">
  <defs>
    <style>
      @keyframes shieldPulse { 0%,100%{opacity:0.7;filter:drop-shadow(0 0 3px #0f0)} 50%{opacity:1;filter:drop-shadow(0 0 10px #0f0)} }
      @keyframes blockFlash { 0%{fill:#f440;stroke:#f44} 20%{fill:#f4433;stroke:#f44} 100%{fill:#f440;stroke:#f443} }
      @keyframes allowGlow { 0%,100%{opacity:0.6} 50%{opacity:1} }
      @keyframes slideIn { 0%{transform:translateX(20px);opacity:0} 100%{transform:translateX(0);opacity:1} }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes redX { 0%{transform:scale(0);opacity:0} 60%{transform:scale(1.3);opacity:1} 100%{transform:scale(1);opacity:1} }
      @keyframes greenCheck { 0%{transform:scale(0);opacity:0} 60%{transform:scale(1.3);opacity:1} 100%{transform:scale(1);opacity:1} }
      @keyframes scanDown { 0%{transform:translateY(0);opacity:0.8} 100%{transform:translateY(180px);opacity:0} }
      .shield { animation: shieldPulse 3s ease-in-out infinite; }
      .block { animation: blockFlash 1.5s ease-in-out infinite; }
      .allow { animation: allowGlow 2s ease-in-out infinite; }
      .si1 { animation: slideIn 0.5s ease-out 0.3s forwards; opacity:0; }
      .si2 { animation: slideIn 0.5s ease-out 0.6s forwards; opacity:0; }
      .si3 { animation: slideIn 0.5s ease-out 0.9s forwards; opacity:0; }
      .si4 { animation: slideIn 0.5s ease-out 1.2s forwards; opacity:0; }
      .si5 { animation: slideIn 0.5s ease-out 1.5s forwards; opacity:0; }
      .si6 { animation: slideIn 0.5s ease-out 1.8s forwards; opacity:0; }
      .si7 { animation: slideIn 0.5s ease-out 2.1s forwards; opacity:0; }
      .si8 { animation: slideIn 0.5s ease-out 2.4s forwards; opacity:0; }
      .rx { animation: redX 0.5s ease-out 0.5s forwards; transform-origin:center; opacity:0; }
      .gc { animation: greenCheck 0.5s ease-out 0.5s forwards; transform-origin:center; opacity:0; }
      .cursor { animation: blink 1s step-end infinite; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0a0a1a"/><stop offset="100%" stop-color="#0d1117"/></linearGradient>
    <linearGradient id="shieldG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f02"/><stop offset="100%" stop-color="#0f005"/></linearGradient>
    <filter id="glG"><feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#0f0" flood-opacity="0.5"/></filter>
    <filter id="glR"><feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#f44" flood-opacity="0.5"/></filter>
  </defs>

  <rect width="900" height="560" fill="url(#bg)"/>
  <g opacity="0.03"><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0L0 0 0 20" fill="none" stroke="#0f0" stroke-width="0.3"/></pattern><rect width="900" height="560" fill="url(#g)"/></g>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#0f0" font-size="16" font-weight="bold" filter="url(#glG)">🛡️ ShadowForge — Ethical Guardrails</text>
  <text x="450" y="48" text-anchor="middle" fill="#6e7681" font-size="10">Blacklist • Whitelist • Severidade • Destrutivas • Backdoor • Exfiltração</text>

  <!-- Central Shield -->
  <g transform="translate(450,170)" class="shield">
    <path d="M 0 -60 C -30 -55 -60 -40 -70 -10 L -70 20 C -70 50 -40 75 0 90 C 40 75 70 50 70 20 L 70 -10 C 60 -40 30 -55 0 -60 Z" fill="url(#shieldG)" stroke="#0f0" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" fill="#0f0" font-size="28">🛡️</text>
    <text x="0" y="30" text-anchor="middle" fill="#0f0" font-size="9" font-weight="bold">VERIFICAÇÃO</text>
    <text x="0" y="42" text-anchor="middle" fill="#0a8" font-size="8">ÉTICA</text>
  </g>

  <!-- Scan line over shield -->
  <rect x="370" y="100" width="160" height="2" rx="1" fill="#0f0" opacity="0.6">
    <animate attributeName="y" from="100" to="280" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- BLOCKED actions (left side) -->
  <g transform="translate(30,100)">
    <text x="0" y="0" fill="#f44" font-size="12" font-weight="bold" filter="url(#glR)">❌ AÇÕES BLOQUEADAS</text>

    <g class="si1" transform="translate(0,18)">
      <rect width="200" height="32" rx="5" fill="#2a0a0a" stroke="#f44" stroke-width="1" class="block"/>
      <text x="10" y="20" fill="#f44" font-size="10">🚫 DELETE database</text>
    </g>
    <g class="si2" transform="translate(0,55)">
      <rect width="200" height="32" rx="5" fill="#2a0a0a" stroke="#f44" stroke-width="1" class="block"/>
      <text x="10" y="20" fill="#f44" font-size="10">🚫 Backdoor implant</text>
    </g>
    <g class="si3" transform="translate(0,92)">
      <rect width="200" height="32" rx="5" fill="#2a0a0a" stroke="#f44" stroke-width="1" class="block"/>
      <text x="10" y="20" fill="#f44" font-size="10">🚫 Exfiltrate data</text>
    </g>
    <g class="si4" transform="translate(0,129)">
      <rect width="200" height="32" rx="5" fill="#2a0a0a" stroke="#f44" stroke-width="1" class="block"/>
      <text x="10" y="20" fill="#f44" font-size="10">🚫 rm -rf / target</text>
    </g>
    <g class="si5" transform="translate(0,166)">
      <rect width="200" height="32" rx="5" fill="#2a0a0a" stroke="#f44" stroke-width="1" class="block"/>
      <text x="10" y="20" fill="#f44" font-size="10">🚫 Rootkit persist</text>
    </g>

    <!-- Blacklist -->
    <g class="si6" transform="translate(0,210)">
      <rect width="200" height="55" rx="5" fill="#161b22" stroke="#f44" stroke-width="1"/>
      <text x="100" y="16" text-anchor="middle" fill="#f44" font-size="9" font-weight="bold">BLACKLIST (CIDR)</text>
      <text x="10" y="32" fill="#8b949e" font-size="9">• 224.0.0.0/4 (multicast)</text>
      <text x="10" y="46" fill="#8b949e" font-size="9">• 127.0.0.0/8 (loopback)</text>
      <text x="10" y="60" fill="#8b949e" font-size="9">• 169.254.0.0/16 (link)</text>
    </g>
  </g>

  <!-- ALLOWED actions (right side) -->
  <g transform="translate(670,100)">
    <text x="0" y="0" fill="#0f0" font-size="12" font-weight="bold" filter="url(#glG)">✅ AÇÕES PERMITIDAS</text>

    <g class="si1" transform="translate(0,18)">
      <rect width="200" height="32" rx="5" fill="#0a2a1a" stroke="#0f0" stroke-width="1" class="allow"/>
      <text x="10" y="20" fill="#0f0" font-size="10">✓ Port scan (Nmap)</text>
    </g>
    <g class="si2" transform="translate(0,55)">
      <rect width="200" height="32" rx="5" fill="#0a2a1a" stroke="#0f0" stroke-width="1" class="allow"/>
      <text x="10" y="20" fill="#0f0" font-size="10">✓ OSINT reconnaisse</text>
    </g>
    <g class="si3" transform="translate(0,92)">
      <rect width="200" height="32" rx="5" fill="#0a2a1a" stroke="#0f0" stroke-width="1" class="allow"/>
      <text x="10" y="20" fill="#0f0" font-size="10">✓ Vulnerability scan</text>
    </g>
    <g class="si4" transform="translate(0,129)">
      <rect width="200" height="32" rx="5" fill="#0a2a1a" stroke="#0f0" stroke-width="1" class="allow"/>
      <text x="10" y="20" fill="#0f0" font-size="10">✓ Screenshot + OCR</text>
    </g>
    <g class="si5" transform="translate(0,166)">
      <rect width="200" height="32" rx="5" fill="#0a2a1a" stroke="#0f0" stroke-width="1" class="allow"/>
      <text x="10" y="20" fill="#0f0" font-size="10">✓ PoC generation</text>
    </g>

    <!-- Whitelist -->
    <g class="si6" transform="translate(0,210)">
      <rect width="200" height="55" rx="5" fill="#161b22" stroke="#0f0" stroke-width="1"/>
      <text x="100" y="16" text-anchor="middle" fill="#0f0" font-size="9" font-weight="bold">WHITELABEL (se definida)</text>
      <text x="10" y="32" fill="#8b949e" font-size="9">• 192.168.1.0/24</text>
      <text x="10" y="46" fill="#8b949e" font-size="9">• lab.company.com</text>
      <text x="10" y="60" fill="#8b949e" font-size="9">• *.test.internal</text>
    </g>
  </g>

  <!-- Decision terminal -->
  <g transform="translate(230,320)">
    <rect width="440" height="220" rx="6" fill="#0d1117" stroke="#0f02"/>
    <rect width="440" height="20" rx="6" fill="#161b22"/><rect y="10" width="440" height="10" fill="#161b22"/>
    <circle cx="12" cy="10" r="3" fill="#ff5f56"/><circle cx="24" cy="10" r="3" fill="#ffbd2e"/><circle cx="36" cy="10" r="3" fill="#27c93f"/>
    <text x="220" y="14" text-anchor="middle" fill="#484f58" font-size="8">ethical-guardrails@gate:~$</text>

    <text x="10" y="38" fill="#f44" font-size="10" class="si2">[BLOQUEADO] ação: "delete database" → impedir_destruicao=True</text>
    <text x="10" y="54" fill="#f44" font-size="10" class="si3">[BLOQUEADO] ação: "backdoor implant" → impedir_backdoor=True</text>
    <text x="10" y="70" fill="#f44" font-size="10" class="si4">[BLOQUEADO] ação: "exfiltrate creds" → impedir_exfiltracao_real=True</text>
    <text x="10" y="86" fill="#f44" font-size="10" class="si5">[BLOQUEADO] alvo: 224.0.0.1 → blacklist: 224.0.0.0/4</text>
    <text x="10" y="102" fill="#ff0" font-size="10" class="si6">[AVISO] alvo: 203.0.113.5 → ALVO PÚBLICO — requer autorização</text>
    <text x="10" y="118" fill="#0f0" font-size="10" class="si7">[PERMITIDO] ação: "scan ports" → reconnaissance permitida</text>
    <text x="10" y="134" fill="#0f0" font-size="10" class="si8">[PERMITIDO] ação: "executar_recon" → alvo 192.168.1.0/24 OK</text>

    <!-- v1.1.0 fix note -->
    <rect x="10" y="150" width="420" height="50" rx="4" fill="#1a2a0a" stroke="#0f02"/>
    <text x="220" y="168" text-anchor="middle" fill="#f0c000" font-size="9" font-weight="bold">🔧 v1.1.0 FIX</text>
    <text x="220" y="182" text-anchor="middle" fill="#8b949e" font-size="8">Blacklist: removido 0.0.0.0/0 que bloqueava TODOS os alvos</text>
    <text x="220" y="194" text-anchor="middle" fill="#8b949e" font-size="8">verificar_etica() agora suporta hostname + CIDR corretamente</text>
  </g>

  <!-- Audit trail -->
  <g transform="translate(30,430)">
    <rect width="190" height="110" rx="6" fill="#161b22" stroke="#58a6ff2"/>
    <text x="95" y="18" text-anchor="middle" fill="#58a6ff" font-size="9" font-weight="bold">AUDIT TRAIL</text>
    <text x="10" y="34" fill="#8b949e" font-size="8">A-20250603-0001</text><text x="130" y="34" fill="#f44" font-size="8">BLOQUEADA</text>
    <text x="10" y="48" fill="#8b949e" font-size="8">A-20250603-0002</text><text x="130" y="48" fill="#f44" font-size="8">BLOQUEADA</text>
    <text x="10" y="62" fill="#8b949e" font-size="8">A-20250603-0003</text><text x="130" y="62" fill="#0f0" font-size="8">PERMITIDA</text>
    <text x="10" y="76" fill="#8b949e" font-size="8">A-20250603-0004</text><text x="130" y="76" fill="#0f0" font-size="8">PERMITIDA</text>
    <text x="10" y="90" fill="#8b949e" font-size="8">A-20250603-0005</text><text x="130" y="90" fill="#0f0" font-size="8">PERMITIDA</text>
    <text x="10" y="104" fill="#6e7681" font-size="7">SQLite persist: ✅ | Logging: ✅</text>
  </g>

  <!-- Config section -->
  <g transform="translate(680,430)">
    <rect width="190" height="110" rx="6" fill="#161b22" stroke="#bc8cff3"/>
    <text x="95" y="18" text-anchor="middle" fill="#bc8cff" font-size="9" font-weight="bold">CONFIGURAÇÃO</text>
    <text x="10" y="36" fill="#8b949e" font-size="8">exigir_autorizacao:</text><text x="150" y="36" fill="#0f0" font-size="8">True</text>
    <text x="10" y="50" fill="#8b949e" font-size="8">verificar_escopo:</text><text x="150" y="50" fill="#0f0" font-size="8">True</text>
    <text x="10" y="64" fill="#8b949e" font-size="8">impedir_destruicao:</text><text x="150" y="64" fill="#0f0" font-size="8">True</text>
    <text x="10" y="78" fill="#8b949e" font-size="8">impedir_backdoor:</text><text x="150" y="78" fill="#0f0" font-size="8">True</text>
    <text x="10" y="92" fill="#8b949e" font-size="8">impedir_exfiltracao:</text><text x="150" y="92" fill="#0f0" font-size="8">True</text>
    <text x="10" y="106" fill="#8b949e" font-size="8">max_severidade:</text><text x="150" y="106" fill="#f0c000" font-size="8">high</text>
  </g>

  <text x="450" y="552" text-anchor="middle" fill="#333" font-size="8">ShadowForge Agent v1.1.0 | Ethics first, hack second. >> | Guardrails NUNCA desativar em produção.</text>
</svg>
