<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="'Courier New', monospace">
  <defs>
    <style>
      @keyframes stepPulse { 0%,100%{opacity:0.6;transform:scale(1)} 50%{opacity:1;transform:scale(1.04)} }
      @keyframes arrowSlide { 0%{stroke-dashoffset:20} 100%{stroke-dashoffset:0} }
      @keyframes progressFill { 0%{width:0} 100%{width:100%} }
      @keyframes dataPulse { 0%,100%{r:2} 50%{r:4} }
      @keyframes typeWrite { 0%{opacity:0;transform:translateY(5px)} 100%{opacity:1;transform:translateY(0)} }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      .step-1 { animation: stepPulse 3s ease-in-out 0s infinite; }
      .step-2 { animation: stepPulse 3s ease-in-out 0.4s infinite; }
      .step-3 { animation: stepPulse 3s ease-in-out 0.8s infinite; }
      .step-4 { animation: stepPulse 3s ease-in-out 1.2s infinite; }
      .step-5 { animation: stepPulse 3s ease-in-out 1.6s infinite; }
      .step-6 { animation: stepPulse 3s ease-in-out 2s infinite; }
      .step-7 { animation: stepPulse 3s ease-in-out 2.4s infinite; }
      .step-8 { animation: stepPulse 2s ease-in-out 2.8s infinite; }
      .arrow-flow { stroke-dasharray:6 4; animation: arrowSlide 1.2s linear infinite; }
      .data-dot { animation: dataPulse 1.5s ease-in-out infinite; }
      .tw1 { animation: typeWrite 0.5s ease-out 0.5s forwards; opacity:0; }
      .tw2 { animation: typeWrite 0.5s ease-out 1s forwards; opacity:0; }
      .tw3 { animation: typeWrite 0.5s ease-out 1.5s forwards; opacity:0; }
      .tw4 { animation: typeWrite 0.5s ease-out 2s forwards; opacity:0; }
      .tw5 { animation: typeWrite 0.5s ease-out 2.5s forwards; opacity:0; }
      .tw6 { animation: typeWrite 0.5s ease-out 3s forwards; opacity:0; }
      .tw7 { animation: typeWrite 0.5s ease-out 3.5s forwards; opacity:0; }
      .tw8 { animation: typeWrite 0.5s ease-out 4s forwards; opacity:0; }
      .cursor { animation: blink 1s step-end infinite; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="idleG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2d333b"/><stop offset="100%" stop-color="#22272e"/></linearGradient>
    <linearGradient id="reconG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a4a2a"/><stop offset="100%" stop-color="#0f3320"/></linearGradient>
    <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a3d6b"/><stop offset="100%" stop-color="#0f284a"/></linearGradient>
    <linearGradient id="enumG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4a3d1a"/><stop offset="100%" stop-color="#33280f"/></linearGradient>
    <linearGradient id="exploitG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6b1a1a"/><stop offset="100%" stop-color="#4a0f0f"/></linearGradient>
    <linearGradient id="postG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5a1a6b"/><stop offset="100%" stop-color="#3f0f4a"/></linearGradient>
    <linearGradient id="reportG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a5a6b"/><stop offset="100%" stop-color="#0f404a"/></linearGradient>
    <linearGradient id="doneG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a6b3c"/><stop offset="100%" stop-color="#0f4a2a"/></linearGradient>
    <filter id="glow"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#0f0" flood-opacity="0.3"/></filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="400" fill="url(#bg)"/>
  <g opacity="0.04"><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0L0 0 0 20" fill="none" stroke="#0f0" stroke-width="0.3"/></pattern><rect width="960" height="400" fill="url(#g)"/></g>

  <!-- Title -->
  <text x="480" y="32" text-anchor="middle" fill="#0f0" font-size="16" font-weight="bold" filter="url(#glow)">SH4D0WF0RG3 — Kill Chain State Machine</text>
  <text x="480" y="50" text-anchor="middle" fill="#58a6ff" font-size="10">IDLE → RECON → SCAN → ENUM → EXPLOIT → POST → REPORT → COMPLETED</text>

  <!-- Phase boxes - top row -->
  <!-- IDLE -->
  <g class="step-1" transform="translate(22,70)">
    <rect width="100" height="80" rx="8" fill="url(#idleG)" stroke="#8b949e" stroke-width="1"/>
    <text x="50" y="24" text-anchor="middle" fill="#8b949e" font-size="20">⏸️</text>
    <text x="50" y="44" text-anchor="middle" fill="#ccc" font-size="11" font-weight="bold">IDLE</text>
    <text x="50" y="60" text-anchor="middle" fill="#666" font-size="8">Aguardando</text>
    <text x="50" y="72" text-anchor="middle" fill="#666" font-size="8">alvo...</text>
  </g>
  <line x1="122" y1="110" x2="138" y2="110" stroke="#8b949e" stroke-width="1.5" class="arrow-flow" marker-end="url(#arr)"/>

  <!-- RECON -->
  <g class="step-2" transform="translate(140,70)">
    <rect width="108" height="80" rx="8" fill="url(#reconG)" stroke="#0f0" stroke-width="1.5"/>
    <text x="54" y="24" text-anchor="middle" fill="#0f0" font-size="20">🔍</text>
    <text x="54" y="44" text-anchor="middle" fill="#0f0" font-size="11" font-weight="bold">RECON</text>
    <text x="54" y="60" text-anchor="middle" fill="#0a8" font-size="8">Nmap SYN</text>
    <text x="54" y="72" text-anchor="middle" fill="#0a8" font-size="8">OSINT + DNS</text>
  </g>
  <line x1="248" y1="110" x2="264" y2="110" stroke="#0f0" stroke-width="1.5" class="arrow-flow"/>

  <!-- SCAN -->
  <g class="step-3" transform="translate(266,70)">
    <rect width="108" height="80" rx="8" fill="url(#scanG)" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="54" y="24" text-anchor="middle" fill="#58a6ff" font-size="20">📡</text>
    <text x="54" y="44" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold">SCAN</text>
    <text x="54" y="60" text-anchor="middle" fill="#388bfd" font-size="8">Port Scan</text>
    <text x="54" y="72" text-anchor="middle" fill="#388bfd" font-size="8">Svc Version</text>
  </g>
  <line x1="374" y1="110" x2="390" y2="110" stroke="#58a6ff" stroke-width="1.5" class="arrow-flow"/>

  <!-- ENUM -->
  <g class="step-4" transform="translate(392,70)">
    <rect width="108" height="80" rx="8" fill="url(#enumG)" stroke="#f0c000" stroke-width="1.5"/>
    <text x="54" y="24" text-anchor="middle" fill="#f0c000" font-size="20">📋</text>
    <text x="54" y="44" text-anchor="middle" fill="#f0c000" font-size="11" font-weight="bold">ENUM</text>
    <text x="54" y="60" text-anchor="middle" fill="#aa8a00" font-size="8">SMB + LDAP</text>
    <text x="54" y="72" text-anchor="middle" fill="#aa8a00" font-size="8">Web Fingerprint</text>
  </g>
  <line x1="500" y1="110" x2="516" y2="110" stroke="#f0c000" stroke-width="1.5" class="arrow-flow"/>

  <!-- EXPLOIT -->
  <g class="step-5" transform="translate(518,70)">
    <rect width="108" height="80" rx="8" fill="url(#exploitG)" stroke="#f44" stroke-width="1.5"/>
    <text x="54" y="24" text-anchor="middle" fill="#f44" font-size="20">⚡</text>
    <text x="54" y="44" text-anchor="middle" fill="#f44" font-size="11" font-weight="bold">EXPLOIT</text>
    <text x="54" y="60" text-anchor="middle" fill="#a33" font-size="8">SQLi + XSS</text>
    <text x="54" y="72" text-anchor="middle" fill="#a33" font-size="8">PoC Gen</text>
  </g>
  <line x1="626" y1="110" x2="642" y2="110" stroke="#f44" stroke-width="1.5" class="arrow-flow"/>

  <!-- POST -->
  <g class="step-6" transform="translate(644,70)">
    <rect width="108" height="80" rx="8" fill="url(#postG)" stroke="#bc8cff" stroke-width="1.5"/>
    <text x="54" y="24" text-anchor="middle" fill="#bc8cff" font-size="20">🔓</text>
    <text x="54" y="44" text-anchor="middle" fill="#bc8cff" font-size="11" font-weight="bold">POST</text>
    <text x="54" y="60" text-anchor="middle" fill="#8b5cf6" font-size="8">PrivEsc</text>
    <text x="54" y="72" text-anchor="middle" fill="#8b5cf6" font-size="8">Pivot + Persist</text>
  </g>
  <line x1="752" y1="110" x2="768" y2="110" stroke="#bc8cff" stroke-width="1.5" class="arrow-flow"/>

  <!-- REPORT -->
  <g class="step-7" transform="translate(770,70)">
    <rect width="108" height="80" rx="8" fill="url(#reportG)" stroke="#0ff" stroke-width="1.5"/>
    <text x="54" y="24" text-anchor="middle" fill="#0ff" font-size="20">📊</text>
    <text x="54" y="44" text-anchor="middle" fill="#0ff" font-size="11" font-weight="bold">REPORT</text>
    <text x="54" y="60" text-anchor="middle" fill="#0aa" font-size="8">PDF + Charts</text>
    <text x="54" y="72" text-anchor="middle" fill="#0aa" font-size="8">Audit Trail</text>
  </g>
  <line x1="878" y1="110" x2="884" y2="110" stroke="#0ff" stroke-width="1.5" class="arrow-flow"/>

  <!-- COMPLETED -->
  <g class="step-8" transform="translate(866,70)">
    <rect width="76" height="80" rx="8" fill="url(#doneG)" stroke="#0f0" stroke-width="2"/>
    <text x="38" y="24" text-anchor="middle" fill="#0f0" font-size="20">✅</text>
    <text x="38" y="46" text-anchor="middle" fill="#0f0" font-size="9" font-weight="bold">DONE</text>
  </g>

  <!-- Progress bar -->
  <g transform="translate(22,170)">
    <rect width="920" height="8" rx="4" fill="#161b22"/>
    <rect width="920" height="8" rx="4" fill="#0f0" opacity="0.7">
      <animate attributeName="width" from="0" to="920" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Terminal output -->
  <g transform="translate(22,195)">
    <rect width="920" height="190" rx="6" fill="#0d1117" stroke="#0f02"/>
    <rect width="920" height="20" rx="6" fill="#161b22"/>
    <rect y="12" width="920" height="8" fill="#161b22"/>
    <circle cx="12" cy="10" r="3.5" fill="#ff5f56"/><circle cx="24" cy="10" r="3.5" fill="#ffbd2e"/><circle cx="36" cy="10" r="3.5" fill="#27c93f"/>
    <text x="460" y="14" text-anchor="middle" fill="#484f58" font-size="8">shadowforge@kill-chain:~$</text>

    <text x="10" y="38" fill="#0f0" font-size="10" class="tw1">[IDLE]     Alvo definido: 192.168.1.0/24 | Autorização: ✅ Range privado</text>
    <text x="10" y="54" fill="#0f0" font-size="10" class="tw2">[RECON]    Nmap -sV -sC → 5 hosts up | DNS: 3 subdomínios | OSINT: 2 e-mails</text>
    <text x="10" y="70" fill="#58a6ff" font-size="10" class="tw3">[SCAN]     22 portas abertas | 80(HTTP), 443(HTTPS), 3306(MySQL), 22(SSH)</text>
    <text x="10" y="86" fill="#f0c000" font-size="10" class="tw4">[ENUM]     WordPress 6.2 | PHP 8.1 | Apache 2.4.54 | MySQL 5.7.38</text>
    <text x="10" y="102" fill="#f44" font-size="10" class="tw5">[EXPLOIT]  CVE-2023-XXXX (SQLi) | CVSS 8.1 | PoC gerado → VALIDADO</text>
    <text x="10" y="118" fill="#bc8cff" font-size="10" class="tw6">[POST]     PrivEsc: SUID binary encontrado | Pivot: 192.168.1.50 acessível</text>
    <text x="10" y="134" fill="#0ff" font-size="10" class="tw7">[REPORT]   PDF gerado: shadowforge_campaign_20250603.pdf | 42 páginas</text>
    <text x="10" y="150" fill="#0f0" font-size="10" class="tw8">[DONE]     ✅ Campanha concluída | 3 vulns | 2 critical | 1 high | Ética: OK</text>
    <text x="10" y="168" fill="#333" font-size="9">Ethics first, hack second. >> <tspan class="cursor">█</tspan></text>
  </g>

  <!-- Data dots along top -->
  <circle cx="60" cy="65" r="2" fill="#0f0" class="data-dot"/>
  <circle cx="200" cy="65" r="2" fill="#0f0" class="data-dot" style="animation-delay:0.3s"/>
  <circle cx="340" cy="65" r="2" fill="#58a6ff" class="data-dot" style="animation-delay:0.6s"/>
  <circle cx="480" cy="65" r="2" fill="#f0c000" class="data-dot" style="animation-delay:0.9s"/>
  <circle cx="620" cy="65" r="2" fill="#f44" class="data-dot" style="animation-delay:1.2s"/>
  <circle cx="760" cy="65" r="2" fill="#bc8cff" class="data-dot" style="animation-delay:1.5s"/>
</svg>
