<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Courier New', monospace">
  <defs>
    <style>
      @keyframes pulse { 0%,100%{opacity:0.4;transform:scale(1)} 50%{opacity:1;transform:scale(1.05)} }
      @keyframes flowArrow { 0%{stroke-dashoffset:40} 100%{stroke-dashoffset:0} }
      @keyframes fadeIn { 0%{opacity:0} 100%{opacity:1} }
      @keyframes scanLine { 0%{transform:translateY(0)} 100%{transform:translateY(120px)} }
      @keyframes typing { 0%{width:0} 100%{width:100%} }
      @keyframes glow { 0%,100%{filter:drop-shadow(0 0 2px #0f0)} 50%{filter:drop-shadow(0 0 8px #0f0)} }
      @keyframes dataStream { 0%{stroke-dashoffset:80} 100%{stroke-dashoffset:0} }
      @keyframes rotate270 { 0%{transform:rotate(0deg);transform-origin:450px 260px} 100%{transform:rotate(270deg);transform-origin:450px 260px} }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      .observe-active { animation: pulse 2s ease-in-out infinite; }
      .orient-active { animation: pulse 2s ease-in-out 0.5s infinite; }
      .decide-active { animation: pulse 2s ease-in-out 1s infinite; }
      .act-active { animation: pulse 2s ease-in-out 1.5s infinite; }
      .flow { stroke-dasharray:8 4; animation: flowArrow 1.5s linear infinite; }
      .data-flow { stroke-dasharray:12 6; animation: dataStream 2s linear infinite; }
      .fade1 { animation: fadeIn 1s ease-out 0s forwards; opacity:0; }
      .fade2 { animation: fadeIn 1s ease-out 0.4s forwards; opacity:0; }
      .fade3 { animation: fadeIn 1s ease-out 0.8s forwards; opacity:0; }
      .fade4 { animation: fadeIn 1s ease-out 1.2s forwards; opacity:0; }
      .fade5 { animation: fadeIn 1s ease-out 1.6s forwards; opacity:0; }
      .fade6 { animation: fadeIn 1s ease-out 2s forwards; opacity:0; }
      .fade7 { animation: fadeIn 1s ease-out 2.4s forwards; opacity:0; }
      .fade8 { animation: fadeIn 1s ease-out 2.8s forwards; opacity:0; }
      .glow-green { animation: glow 2s ease-in-out infinite; }
      .cursor-blink { animation: blink 1s step-end infinite; }
    </style>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="observeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a6b3c"/>
      <stop offset="100%" stop-color="#0f4a2a"/>
    </linearGradient>
    <linearGradient id="orientGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b5a1a"/>
      <stop offset="100%" stop-color="#4a3f0f"/>
    </linearGradient>
    <linearGradient id="decideGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3c6b"/>
      <stop offset="100%" stop-color="#0f2a4a"/>
    </linearGradient>
    <linearGradient id="actGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b1a2a"/>
      <stop offset="100%" stop-color="#4a0f1a"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="url(#bgGrad)"/>
  <!-- Grid pattern -->
  <g opacity="0.06">
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#0f0" stroke-width="0.5"/>
    </pattern>
    <rect width="900" height="620" fill="url(#grid)"/>
  </g>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#0f0" font-size="18" font-weight="bold" class="glow-green">SH4D0WF0RG3 — OODA Loop Simulation</text>
  <text x="450" y="56" text-anchor="middle" fill="#0a8" font-size="11">v1.1.0 | Autonomous Ethical Hacking AI | NVIDIA Powered</text>

  <!-- Central OODA Ring -->
  <g transform="translate(450,260)">
    <!-- Ring connections -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="#0f03" stroke-width="2" stroke-dasharray="4 8"/>
    <path d="M 0 -130 L 0 -145" stroke="#0f0" stroke-width="2" class="data-flow" marker-end="url(#arrowG)"/>
    <path d="M 130 0 L 145 0" stroke="#0f0" stroke-width="2" class="data-flow"/>
    <path d="M 0 130 L 0 145" stroke="#0f0" stroke-width="2" class="data-flow"/>
    <path d="M -130 0 L -145 0" stroke="#0f0" stroke-width="2" class="data-flow"/>

    <!-- OBSERVE node -->
    <g transform="translate(0,-130)" class="observe-active">
      <rect x="-70" y="-28" width="140" height="56" rx="10" fill="url(#observeGrad)" stroke="#0f0" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="0" y="-8" text-anchor="middle" fill="#0f0" font-size="14" font-weight="bold">🔍 OBSERVE</text>
      <text x="0" y="10" text-anchor="middle" fill="#0a8" font-size="9">Screenshot + OCR</text>
    </g>

    <!-- ORIENT node -->
    <g transform="translate(160,0)" class="orient-active">
      <rect x="-70" y="-28" width="140" height="56" rx="10" fill="url(#orientGrad)" stroke="#ff0" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="0" y="-8" text-anchor="middle" fill="#ff0" font-size="14" font-weight="bold">🧭 ORIENT</text>
      <text x="0" y="10" text-anchor="middle" fill="#aa8" font-size="9">RAG + MITRE ATT&amp;CK</text>
    </g>

    <!-- DECIDE node -->
    <g transform="translate(0,130)" class="decide-active">
      <rect x="-70" y="-28" width="140" height="56" rx="10" fill="url(#decideGrad)" stroke="#0af" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="0" y="-8" text-anchor="middle" fill="#0af" font-size="14" font-weight="bold">⚡ DECIDE</text>
      <text x="0" y="10" text-anchor="middle" fill="#08a" font-size="9">Guardrails Éticos</text>
    </g>

    <!-- ACT node -->
    <g transform="translate(-160,0)" class="act-active">
      <rect x="-70" y="-28" width="140" height="56" rx="10" fill="url(#actGrad)" stroke="#f44" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="0" y="-8" text-anchor="middle" fill="#f44" font-size="14" font-weight="bold">🎯 ACT</text>
      <text x="0" y="10" text-anchor="middle" fill="#a44" font-size="9">Execute + Persist</text>
    </g>

    <!-- Central ring arrows -->
    <path d="M 0 -100 C 50 -80 80 -40 100 0" fill="none" stroke="#0f06" stroke-width="2" class="flow"/>
    <path d="M 100 0 C 80 40 50 80 0 100" fill="none" stroke="#0f06" stroke-width="2" class="flow"/>
    <path d="M 0 100 C -50 80 -80 40 -100 0" fill="none" stroke="#0f06" stroke-width="2" class="flow"/>
    <path d="M -100 0 C -80 -40 -50 -80 0 -100" fill="none" stroke="#0f06" stroke-width="2" class="flow"/>
  </g>

  <!-- Terminal simulation -->
  <g transform="translate(20,440)">
    <rect x="0" y="0" width="860" height="160" rx="6" fill="#0d1117" stroke="#0f03" stroke-width="1"/>
    <!-- Terminal header -->
    <rect x="0" y="0" width="860" height="22" rx="6" fill="#161b22"/>
    <rect x="0" y="12" width="860" height="10" fill="#161b22"/>
    <circle cx="14" cy="11" r="4" fill="#ff5f56"/>
    <circle cx="28" cy="11" r="4" fill="#ffbd2e"/>
    <circle cx="42" cy="11" r="4" fill="#27c93f"/>
    <text x="430" y="15" text-anchor="middle" fill="#8b949e" font-size="9">shadowforge@agent:~$</text>

    <!-- Terminal lines - animated typing -->
    <text x="12" y="40" fill="#0f0" font-size="11" class="fade1">$ shadowforge --mode stealth --target 192.168.1.0/24</text>
    <text x="12" y="56" fill="#0a8" font-size="10" class="fade2">[OBSERVE] 5 observações coletadas | Screenshot: OK | OCR: OK</text>
    <text x="12" y="72" fill="#ff0" font-size="10" class="fade3">[ORIENT] Fase: reconnaissance | Técnicas RAG: 12 | MITRE: T1046,T1087</text>
    <text x="12" y="88" fill="#0af" font-size="10" class="fade4">[DECIDE] Ação: executar_recon | Alvo: 192.168.1.0/24 | ✅ Ética: PERMITIDO</text>
    <text x="12" y="104" fill="#f44" font-size="10" class="fade5">[ACT] Nmap SYN scan → 5 hosts | 22 portas abertas | SQLite: persistido</text>
    <text x="12" y="120" fill="#0a8" font-size="10" class="fade6">[NIM] Modelo ativo: meta/llama-3.3-70b-instruct | Tokens: 2,847</text>
    <text x="12" y="136" fill="#8b949e" font-size="10" class="fade7">[MEM] Curto prazo: 23 entradas | Longo prazo: 5 lições recuperadas</text>
    <text x="12" y="150" fill="#0f0" font-size="10" class="fade8">[OODA #2] Ciclo completo | Avançando para SCAN ▶<tspan class="cursor-blink">█</tspan></text>
  </g>

  <!-- Subsystems sidebar -->
  <g transform="translate(720,80)">
    <rect x="0" y="0" width="160" height="340" rx="6" fill="#0d1117" stroke="#0f02" stroke-width="1"/>
    <text x="80" y="20" text-anchor="middle" fill="#0f0" font-size="11" font-weight="bold">SUBSISTEMAS</text>
    <line x1="10" y1="28" x2="150" y2="28" stroke="#0f02" stroke-width="1"/>

    <!-- GPU -->
    <text x="12" y="48" fill="#8b949e" font-size="9">🔴 GPU</text>
    <text x="70" y="48" fill="#0f0" font-size="9">NVIDIA RTX 4090</text>
    <!-- NIM -->
    <text x="12" y="68" fill="#8b949e" font-size="9">🔴 NIM</text>
    <text x="70" y="68" fill="#0f0" font-size="9">LLaMA-3.3-70B</text>
    <!-- Vision -->
    <text x="12" y="88" fill="#8b949e" font-size="9">🔴 VISION</text>
    <text x="70" y="88" fill="#0f0" font-size="9">OCR + Capture</text>
    <!-- Speech -->
    <text x="12" y="108" fill="#8b949e" font-size="9">⚫ VOICE</text>
    <text x="70" y="108" fill="#666" font-size="9">DESATIVADO</text>
    <!-- Stealth -->
    <text x="12" y="128" fill="#8b949e" font-size="9">🔴 STEALTH</text>
    <text x="70" y="128" fill="#0f0" font-size="9">Bezier Mouse</text>
    <!-- Hacker -->
    <text x="12" y="148" fill="#8b949e" font-size="9">🔴 RECON</text>
    <text x="70" y="148" fill="#0f0" font-size="9">Nmap + DNS</text>
    <!-- Exploit -->
    <text x="12" y="168" fill="#8b949e" font-size="9">🔴 EXPLOIT</text>
    <text x="70" y="168" fill="#0f0" font-size="9">SQLi + XSS</text>
    <!-- Report -->
    <text x="12" y="188" fill="#8b949e" font-size="9">🔴 REPORT</text>
    <text x="70" y="188" fill="#0f0" font-size="9">PDF + Charts</text>
    <!-- EventBus -->
    <text x="12" y="208" fill="#8b949e" font-size="9">🔴 EVENTS</text>
    <text x="70" y="208" fill="#0f0" font-size="9">47 eventos/s</text>
    <!-- Memory -->
    <text x="12" y="228" fill="#8b949e" font-size="9">🔴 MEMORY</text>
    <text x="70" y="228" fill="#0f0" font-size="9">SQLite + aiosqlite</text>
    <!-- Plugins -->
    <text x="12" y="248" fill="#8b949e" font-size="9">🔴 PLUGINS</text>
    <text x="70" y="248" fill="#0f0" font-size="9">3 loaded</text>

    <!-- Kill Chain progress -->
    <line x1="10" y1="262" x2="150" y2="262" stroke="#0f02" stroke-width="1"/>
    <text x="80" y="280" text-anchor="middle" fill="#ff0" font-size="10" font-weight="bold">KILL CHAIN</text>
    <rect x="12" y="292" width="136" height="10" rx="3" fill="#161b22"/>
    <rect x="12" y="292" width="45" height="10" rx="3" fill="#0f0" class="observe-active"/>
    <text x="12" y="316" fill="#0f0" font-size="8">■ IDLE</text>
    <text x="50" y="316" fill="#0f0" font-size="8">■ RECON</text>
    <text x="95" y="316" fill="#333" font-size="8">□ SCAN</text>
    <text x="12" y="332" fill="#333" font-size="8">□ ENUM □ EXPLOIT □ POST □ REPORT</text>
  </g>

  <!-- Data streams -->
  <g opacity="0.15">
    <path d="M 20 80 Q 60 120 20 160 Q 60 200 20 240" fill="none" stroke="#0f0" stroke-width="1" class="data-flow"/>
    <path d="M 880 80 Q 840 120 880 160 Q 840 200 880 240" fill="none" stroke="#0af" stroke-width="1" class="data-flow"/>
  </g>

  <!-- Footer -->
  <text x="450" y="614" text-anchor="middle" fill="#333" font-size="8">ShadowForge Agent v1.1.0 | Ethics first, hack second. >> | Authorized pentest only.</text>
</svg>
