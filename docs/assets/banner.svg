<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-labelledby="t d">
  <title id="t">ShadowForge Agent</title>
  <desc id="d">Banner: agente de pentest autorizado com escopo obrigatório, confirmação, dry-run e trilha de auditoria.</desc>
  <style>
    :root { --bg:#f6f8fa; --fg:#0f172a; --muted:#475569; --accent:#047857; --grid:#d0d7de; --chip:#ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9aa4b2; --accent:#3fb950; --grid:#21262d; --chip:#161b22; }
    }
    .bg { fill: var(--bg); }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .title { fill: var(--fg); font: 700 64px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; }
    .sub { fill: var(--muted); font: 400 22px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .chip rect { fill: var(--chip); stroke: var(--accent); stroke-width: 1.5; }
    .chip text { fill: var(--fg); font: 600 16px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scan { fill: var(--accent); opacity: .12; animation: varrer 6s linear infinite; }
    .cursor { fill: var(--accent); animation: piscar 1.1s steps(1) infinite; }
    .chip { opacity: 0; animation: surgir .6s ease-out forwards; }
    .c2 { animation-delay: .3s; } .c3 { animation-delay: .6s; } .c4 { animation-delay: .9s; }
    @keyframes varrer { from { transform: translateX(-260px); } to { transform: translateX(1200px); } }
    @keyframes piscar { 50% { opacity: 0; } }
    @keyframes surgir { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .scan, .cursor { animation: none; }
      .scan { display: none; }
      .chip { animation: none; opacity: 1; }
    }
  </style>
  <rect class="bg" width="1200" height="280" rx="16"/>
  <g class="grid" opacity=".6">
    <path d="M0 70H1200M0 140H1200M0 210H1200"/>
    <path d="M150 0V280M300 0V280M450 0V280M600 0V280M750 0V280M900 0V280M1050 0V280"/>
  </g>
  <rect class="scan" x="0" y="0" width="220" height="280"/>
  <text class="title" x="60" y="118">SHADOWFORGE<tspan class="sub" dx="16" dy="-6">agent</tspan></text>
  <rect class="cursor" x="62" y="134" width="22" height="4"/>
  <text class="sub" x="60" y="172">Agente de pentest autorizado — loop OODA, relatórios e salvaguardas éticas</text>
  <g class="chip c1"><rect x="60" y="200" width="200" height="40" rx="20"/><text x="160" y="226" text-anchor="middle">escopo obrigatório</text></g>
  <g class="chip c2"><rect x="276" y="200" width="250" height="40" rx="20"/><text x="401" y="226" text-anchor="middle">confirmação (fail-closed)</text></g>
  <g class="chip c3"><rect x="542" y="200" width="130" height="40" rx="20"/><text x="607" y="226" text-anchor="middle">dry-run</text></g>
  <g class="chip c4"><rect x="688" y="200" width="250" height="40" rx="20"/><text x="813" y="226" text-anchor="middle">trilha de auditoria (hash)</text></g>
</svg>
